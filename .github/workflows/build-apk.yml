name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Arrange web files into www/
        run: |
          mkdir -p www/pdfs www/libs/wasm
          cp index.html pdf-viewer.html knowledge.js www/
          cp ./*.pdf www/pdfs/ 2>/dev/null || echo "No PDFs found in repo root"
          cp genai_bundle.mjs www/libs/ 2>/dev/null || true
          cp genai_wasm* www/libs/wasm/ 2>/dev/null || true
          ls -la www www/pdfs

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          res = 'android/app/src/main/res'
          full = Image.open('icon.png').convert('RGBA')
          fg = Image.open('icon-foreground.png').convert('RGBA')
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (s, f) in sizes.items():
              p = f'{res}/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              a = full.resize((s, s), Image.LANCZOS)
              a.save(f'{p}/ic_launcher.png')
              m = Image.new('L', (s * 4, s * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, s * 4 - 1, s * 4 - 1), fill=255)
              r = a.copy()
              r.putalpha(m.resize((s, s), Image.LANCZOS))
              r.save(f'{p}/ic_launcher_round.png')
              fg.resize((f, f), Image.LANCZOS).save(f'{p}/ic_launcher_foreground.png')
          os.makedirs(f'{res}/values', exist_ok=True)
          open(f'{res}/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1E1355</color>\n</resources>\n')
          print('icons written')
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 11th-SKC-Physics.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 11th-SKC-Physics-APK
          path: 11th-SKC-Physics.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 11th SKC Physics - build ${{ github.run_number }}
          files: 11th-SKC-Physics.apk
